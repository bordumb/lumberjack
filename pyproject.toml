[project]
name = "lumberjack"
version = "0.1.0"
description = "A typed harness for running a swarm of AI agents in parallel git worktrees."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.11",
    "pydantic-ai-slim[anthropic,mcp]>=1.0",
    "aiosqlite>=0.20",
    "watchfiles>=1.0",
    "cyclopts>=3.0",
    "textual>=1.0",
]

[project.scripts]
lj = "lumberjack.cli.main:main"

[dependency-groups]
dev = [
    "ruff>=0.9",
    "ty>=0.0.1a1",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "hypothesis>=6.120",
    "coverage>=7.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lumberjack"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "TC", "ANN", "RUF", "ASYNC", "PTH"]
# TC001-TC003 fight pydantic: models need their annotations resolvable at runtime.
ignore = ["ANN401", "B008", "TC001", "TC002", "TC003"]

[tool.ruff.lint.per-file-ignores]
# ASYNC240: reading a fixture file inside an async test is not a blocking concern.
"tests/**" = ["ANN", "A002", "ASYNC240"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]
runtime-evaluated-decorators = ["pydantic.validate_call", "dataclasses.dataclass"]

[tool.ty.rules]
possibly-unresolved-reference = "error"
unused-ignore-comment = "error"

[tool.ty.src]
include = ["src", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error"]
markers = ["live: hits a real model provider; opt in with -m live"]
addopts = "-m 'not live'"
