[project]
name = "lumberjack"
version = "0.1.0"
description = "A typed harness for running a swarm of AI agents in parallel git worktrees."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.11",
    "pydantic-ai-slim[anthropic,mcp]>=1.0",
    "aiosqlite>=0.20",
    "watchfiles>=1.0",
    "cyclopts>=3.0",
    "rich>=13.0",
    "textual>=1.0",
]

[project.optional-dependencies]
# Optional on purpose: NullTelemetry is the default, so the harness runs and the test
# suite stays fast with none of this installed. `uv sync --extra telemetry` turns it on.
# Logfire needs nothing extra -- it speaks OTLP.
telemetry = [
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
]

[project.scripts]
lj = "lumberjack.cli.main:main"

[dependency-groups]
dev = [
    "ruff>=0.9",
    "ty>=0.0.1a1",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "hypothesis>=6.120",
    "coverage>=7.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lumberjack"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "TC", "ANN", "RUF", "ASYNC", "PTH"]
# TC001-TC003 fight pydantic: models need their annotations resolvable at runtime.
# ASYNC240: a handful of stat() calls during preflight are not a blocking concern,
# and the alternative is an async filesystem dependency for three existence checks.
ignore = ["ANN401", "ASYNC240", "B008", "TC001", "TC002", "TC003"]

[tool.ruff.lint.per-file-ignores]
# ASYNC240: reading a fixture file inside an async test is not a blocking concern.
"tests/**" = ["ANN", "A002", "ASYNC240"]

[tool.ruff.lint.isort]
# `tests` is first-party: the shared doubles in tests/fakes.py are imported by name.
known-first-party = ["lumberjack", "tests"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]
runtime-evaluated-decorators = ["pydantic.validate_call", "dataclasses.dataclass"]

[tool.ty.rules]
possibly-unresolved-reference = "error"
unused-ignore-comment = "error"

[tool.ty.src]
include = ["src", "tests"]

# The OpenTelemetry SDK lives behind the `telemetry` extra, so it is absent from a
# default `uv sync` and unresolvable by definition. Scoped to the one adapter that
# imports it, and only for that rule, so a genuine typo anywhere else still fails.
[[tool.ty.overrides]]
include = ["src/lumberjack/adapters/otel.py"]

[tool.ty.overrides.rules]
unresolved-import = "ignore"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# So `from tests.fakes import ...` resolves. The house rules put shared test doubles in
# tests/fakes.py, and without the repo root on sys.path that import does not exist.
pythonpath = ["."]
filterwarnings = [
    "error",
    # asyncio finalizes subprocess transports at collection time, in whatever test
    # happens to be running. The suite drives a lot of real git, so this surfaced as a
    # failure that moved between unrelated tests. Every process the harness owns is
    # terminated explicitly; this is the interpreter tidying up after them.
    "ignore::ResourceWarning",
]
markers = ["live: hits a real model provider; opt in with -m live"]
addopts = "-m 'not live'"
